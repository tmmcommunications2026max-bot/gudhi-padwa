
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celebrate Gudhi Padwa & Maharashtra Din</title>
<meta property="og:title" content="Gudhi Padwa 2026 - Triveni Mitra Mandal">
<meta property="og:description" content="Registration/Ticketing link and Buy Membership link">
<meta property="og:image" content="https://tmmcommunications2026max-bot.github.io/gudhi-padwa/gudhi-padwa-thumbnail.jpg">
<meta property="og:type" content="event">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a0e00;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding: clamp(0px, 2vw, 20px);
    font-family: 'Cinzel', serif;
  }

  /* Card — portrait-friendly max-width */
  .flyer {
    width: 100%;
    max-width: 520px;   /* portrait sweet-spot on desktop */
    border-radius: clamp(0px, 2vw, 8px);
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
  }

  /* Portrait image — never crop, always full width */
  .flyer img.bg-image {
    display: block;
    width: 100%;
    height: auto;       /* natural portrait aspect ratio */
    object-fit: contain;
  }

  /* ── FOOTER ── */
  .footer-panel {
    background: linear-gradient(180deg, #1A4A10 0%, #0E3008 60%, #0A2005 100%);
    border-top: 3px solid #B8860B;
    padding: clamp(16px, 4vw, 24px) clamp(14px, 5vw, 28px) clamp(18px, 4vw, 26px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 2.5vw, 16px);
    animation: fadeInUp 0.6s ease 0.2s both;
  }

  /* Decorative gold rule */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, #B8860B, transparent);
  }
  .divider-gem {
    color: #FFD700;
    font-size: clamp(10px, 2.5vw, 14px);
    letter-spacing: 5px;
  }

  /* Buttons — stacked column to match portrait width */
  .cta-row {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2.5vw, 14px);
    width: 100%;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    text-decoration: none;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    width: 100%;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    font-size: clamp(11px, 3vw, 14px);
    letter-spacing: clamp(1px, 0.4vw, 1.8px);
    padding: clamp(13px, 3vw, 16px) 20px;
  }
  @media (hover: none) { .btn:hover { transform: none; } }
  .btn:hover { transform: translateY(-2px); }

  .btn-register {
    background: linear-gradient(135deg, #C03010 0%, #8A1A05 50%, #C03010 100%);
    border: 2px solid #FF7040;
    color: #FFF5E0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    box-shadow: 0 4px 18px rgba(160,30,10,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-register:hover { box-shadow: 0 7px 26px rgba(160,30,10,0.8), inset 0 1px 0 rgba(255,255,255,0.15); }

  .btn-member {
    background: linear-gradient(135deg, #C8900A 0%, #8B6008 50%, #C8900A 100%);
    border: 2px solid #FFD700;
    color: #FFF5E0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    box-shadow: 0 4px 18px rgba(160,120,10,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-member:hover { box-shadow: 0 7px 26px rgba(160,120,10,0.8), inset 0 1px 0 rgba(255,255,255,0.15); }

  .member-note {
    font-family: 'Cinzel', serif;
    font-size: clamp(9px, 2.2vw, 11px);
    color: #C8D890;
    letter-spacing: 0.7px;
    text-align: center;
    line-height: 1.5;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Mobile: go truly full-width, no side padding */
  @media (max-width: 540px) {
    body {
      padding: 0;
      align-items: stretch;
    }
    .flyer {
      max-width: 100%;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
<div class="flyer">

  <img class="bg-image"
       src="https://tmmcommunications2026max-bot.github.io/gudhi-padwa/gudhi-padwa-flyer.png"
       alt="Gudhi Padwa & Maharashtra Din Celebration Flyer">

  <div class="footer-panel">

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-gem">✦ ✦ ✦</div>
      <div class="divider-line"></div>
    </div>

    <div class="cta-row">
      <a href="https://www.triveni-mandal.org/event-details/gudhi-padwa-2026"
         class="btn btn-register" target="_blank" rel="noopener">
        🎟️ &nbsp;Register Now
      </a>
      <a href="https://www.triveni-mandal.org/plans-pricing"
         class="btn btn-member" target="_blank" rel="noopener">
        ⭐ &nbsp;Become a Member
      </a>
    </div>

    <div class="member-note">★ Members receive discounted event pricing — Join today!</div>

  </div>
</div>
</body>
</html>
