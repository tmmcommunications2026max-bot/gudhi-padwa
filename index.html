<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celebrate Gudhi Padwa & Maharashtra Din</title>
    <meta property="og:title" content="Gudhi Padwa 2026 - Triveni Mitra Mandal">
    <meta property="og:description" content="Registration/Ticketing link and Membership link">
    <meta property="og:image" content="https://tmmcommunications2026max-bot.github.io/gudhi-padwa/gudhi-padwa-thumbnail.jpg">
    <meta property="og:type" content="event">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a0e00;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: 'Cinzel', serif;
  }

  .flyer {
    width: 900px;
    max-width: 100%;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
  }

  .flyer img.bg-image {
    display: block;
    width: 100%;
    height: auto;
  }

  .footer-panel {
    background: linear-gradient(180deg, #1A4A10 0%, #0E3008 60%, #0A2005 100%);
    border-top: 3px solid #B8860B;
    padding: 20px 28px 22px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 22px;
  }

  /* Logo — no border, no outline, no crop */
  .footer-logo {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .footer-logo img {
    width: 100px;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .logo-divider {
    flex-shrink: 0;
    width: 1px;
    height: 70px;
    background: linear-gradient(to bottom, transparent, #B8860B, transparent);
  }

  .footer-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, #B8860B, transparent);
  }
  .divider-gem { color: #FFD700; font-size: 14px; letter-spacing: 6px; }

  .cta-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.8px;
    text-decoration: none;
    border-radius: 5px;
    padding: 13px 30px;
    cursor: pointer;
    text-transform: uppercase;
    min-width: 200px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); }

  .btn-register {
    background: linear-gradient(135deg, #C03010 0%, #8A1A05 50%, #C03010 100%);
    border: 2.5px solid #FF7040;
    color: #FFF5E0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    box-shadow: 0 5px 20px rgba(160,30,10,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-register:hover { box-shadow: 0 8px 28px rgba(160,30,10,0.8), inset 0 1px 0 rgba(255,255,255,0.15); }

  .btn-member {
    background: linear-gradient(135deg, #C8900A 0%, #8B6008 50%, #C8900A 100%);
    border: 2.5px solid #FFD700;
    color: #FFF5E0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    box-shadow: 0 5px 20px rgba(160,120,10,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-member:hover { box-shadow: 0 8px 28px rgba(160,120,10,0.8), inset 0 1px 0 rgba(255,255,255,0.15); }

  .member-note {
    font-family: 'Cinzel', serif;
    font-size: 10.5px;
    color: #C8D890;
    letter-spacing: 1px;
    text-align: center;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .footer-panel { animation: fadeInUp 0.6s ease 0.2s both; }

  @media (max-width: 600px) {
    .footer-panel { flex-direction: column; }
    .logo-divider { width: 80px; height: 1px; }
    .btn { min-width: 160px; font-size: 11px; padding: 10px 16px; }
    .cta-row { gap: 10px; }
  }
</style>
</head>
